/* Generated non-musical noise effects. No audio plays until a player action calls play(). */
(() => {
  let level=.65,context;
  const sounds={paper:[.16,1250],latch:[.24,360],notice:[.075,1900]};
  function setLevel(value){level=Math.max(0,Math.min(1,(Number(value)||0)/100))}
  function play(name){const spec=sounds[name];if(!spec||!level||!window.AudioContext)return false;try{context ||= new AudioContext();if(context.state==='suspended')context.resume();const duration=spec[0],length=Math.ceil(context.sampleRate*duration),buffer=context.createBuffer(1,length,context.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*(1-i/length);const source=context.createBufferSource(),filter=context.createBiquadFilter(),gain=context.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=spec[1];filter.Q.value=.6;const now=context.currentTime;gain.gain.setValueAtTime(.0001,now);gain.gain.linearRampToValueAtTime(.13*level,now+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);source.connect(filter).connect(gain).connect(context.destination);source.start(now);source.stop(now+duration);return true}catch{return false}}
  window.LM_Audio={setLevel,play};
})();

  function renderCredits(main){renderEnding(main)}
  function openEvidence(){const body=document.createElement('div');if(!state.evidence.length){body.innerHTML='<div class="empty-state">لم تُكتشف أدلة بعد.<br>افحص العناصر المهمة في المشهد.</div>'}else{let grid=document.createElement('div');grid.className='evidence-grid';state.evidence.forEach(id=>{let d=D.evidence[id];if(!d)return;let card=document.createElement('article');card.className='evidence-card';card.innerHTML=`<div class="evidence-symbol" aria-hidden="true">${evidenceSymbol(id)}</div><div class="evidence-copy"><h3></h3><p></p><div class="evidence-meta"></div></div>`;$('h3',card).textContent=d[0];$('p',card).textContent=d[1];$('.evidence-meta',card).textContent=d[2];grid.append(card)});body.append(grid)}showModal('دفتر الأدلة',body)}
  function evidenceSymbol(id){if(['photo','photoNote'].includes(id))return '▧';if(['diary','lastLetter','firstLetter','fatherLetter','fatherNote'].includes(id))return '▤';if(['recorder','recording'].includes(id))return '◉';if(['key','address'].includes(id))return '⌘';if(['reports','nora'].includes(id))return '▦';return '✉'}
  function openMessages(){let body=document.createElement('div');if(!state.messages.length)body.innerHTML='<div class="empty-state">لا توجد رسائل جديدة.</div>';else{let list=document.createElement('div');list.className='message-list';state.messages.forEach(m=>{let card=document.createElement('article');card.className='message-card';let h=document.createElement('h3'),p=document.createElement('p');h.textContent=m.from;p.textContent='«'+m.text+'»';card.append(h,p);list.append(card);m.read=true});body.append(list);save()}showModal('الرسائل',body)}
  function openLog(){let body=document.createElement('div');if(!state.log.length)body.innerHTML='<div class="empty-state">سيظهر هنا سجل الحوارات بعد تقدمك في القصة.</div>';else{[...state.log].reverse().forEach(item=>{let row=document.createElement('div');row.className='log-entry';let who=document.createElement('strong'),p=document.createElement('p');who.textContent=item.speaker;p.textContent=item.text;row.append(who,p);body.append(row)})}showModal('سجل الحوار',body)}
  function openSettings(){let body=document.createElement('div');body.innerHTML=`<label class="range-row"><span>المؤثرات</span><input id="sfx" type="range" min="0" max="100" value="${settings.sfx}"><span id="sfx-value">${settings.sfx}%</span></label><label class="range-row"><span>حجم النص</span><select id="text-size"><option value="s">صغير</option><option value="m">متوسط</option><option value="l">كبير</option></select><span></span></label><label class="range-row"><span>تقليل الحركة</span><input id="motion" type="checkbox" ${settings.reducedMotion?'checked':''}><span></span></label><p class="quiet-note">لا توجد موسيقى. المؤثرات المتاحة أصوات قصيرة غير موسيقية للورق والقفل وإشعار الهاتف، وتعمل بعد تفاعل اللاعب.</p>`;let reset=document.createElement('button');reset.className='action-button';reset.textContent='إعادة ضبط التقدم';let done=document.createElement('button');done.className='action-button primary';done.style.marginRight='8px';done.textContent='تم';body.append(reset,done);showModal('الإعدادات',body);$('#text-size').value=settings.textSize;$('#sfx').oninput=e=>{$('#sfx-value').textContent=e.target.value+'%';settings.sfx=Number(e.target.value);window.LM_Audio?.setLevel(settings.sfx);saveSettings()};$('#text-size').onchange=e=>{settings.textSize=e.target.value;saveSettings();document.querySelector('#main').classList.remove('text-size-s','text-size-m','text-size-l');document.querySelector('#main').classList.add('text-size-'+settings.textSize)};$('#motion').onchange=e=>{settings.reducedMotion=e.target.checked;saveSettings();document.body.classList.toggle('reduced-motion',settings.reducedMotion)};reset.onclick=()=>{let b=document.createElement('div');b.innerHTML='<p>سيُحذف تقدم اللعبة المحفوظ وإعداداتها.</p>';let yes=document.createElement('button'),no=document.createElement('button');yes.className='action-button primary';yes.textContent='إعادة الضبط';no.className='action-button';no.textContent='إلغاء';b.append(yes,no);showModal('تأكيد إعادة الضبط',b);no.onclick=()=>{closeModal();openSettings()};yes.onclick=()=>{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(SETTINGS_KEY);state=freshState();settings=readSettings();closeModal();render()}};done.onclick=()=>{closeModal();render()}}
  $('#toolbar').addEventListener('click',e=>{let b=e.target.closest('[data-panel]');if(!b)return;({evidence:openEvidence,messages:openMessages,log:openLog,settings:openSettings})[b.dataset.panel]?.()});
  $('#menu-button').onclick=()=>{if(!state.started){openSettings();return}let body=document.createElement('div');body.innerHTML='<p>تقدمك محفوظ تلقائيًا.</p>';let actions=document.createElement('div');actions.className='menu-actions';[['استمرار',()=>closeModal()],['الإعدادات',()=>openSettings()],['حفظ والعودة للقائمة',()=>{save();state.started=false;closeModal();render()}],['إعادة ضبط التقدم',()=>{closeModal();openSettings();setTimeout(()=>$('#overlay-root .action-button')?.click(),0)}]].forEach(([label,fn])=>{let b=document.createElement('button');b.className='action-button';b.textContent=label;b.onclick=fn;actions.append(b)});body.append(actions);showModal('القائمة',body)};
  document.querySelector('[data-home]').onclick=e=>{e.preventDefault();if(state.started){save();state.started=false;render()}};
  document.addEventListener('keydown',e=>{if(!modal&&state.started&&['e','E'].includes(e.key))openEvidence();if(!modal&&state.started&&['Escape'].includes(e.key))$('#menu-button').click()});
  render();
})();

</script>
</body>
</html>
